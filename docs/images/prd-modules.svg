<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">模块图</title>
  <desc id="desc">信息获取、AI分析、案例爬取三个模块，每个模块下有三个子模块。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #242424; }
      .title { font-size: 32px; font-weight: 700; }
      .group { font-size: 27px; font-weight: 600; }
      .item { font-size: 23px; }
      .box { fill: white; stroke: #696969; stroke-width: 1.8; }
      .rule { stroke: #e3e3e3; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1300" height="560" fill="white"/>
  <text x="75" y="75" class="title">模块图</text>

  <text x="75" y="190" class="group">信息获取模块</text>
  <rect x="360" y="145" width="270" height="78" class="box"/>
  <rect x="660" y="145" width="270" height="78" class="box"/>
  <rect x="960" y="145" width="270" height="78" class="box"/>
  <text x="495" y="193" text-anchor="middle" class="item">学术背景</text>
  <text x="795" y="193" text-anchor="middle" class="item">个人经历</text>
  <text x="1095" y="193" text-anchor="middle" class="item">申请意向</text>
  <path d="M75 253 H1230" class="rule"/>

  <text x="75" y="330" class="group">AI分析模块</text>
  <rect x="360" y="285" width="270" height="78" class="box"/>
  <rect x="660" y="285" width="270" height="78" class="box"/>
  <rect x="960" y="285" width="270" height="78" class="box"/>
  <text x="495" y="333" text-anchor="middle" class="item">候选项目筛选</text>
  <text x="795" y="333" text-anchor="middle" class="item">逐项目分析</text>
  <text x="1095" y="333" text-anchor="middle" class="item">结果校验与比较</text>
  <path d="M75 393 H1230" class="rule"/>

  <text x="75" y="470" class="group">案例爬取模块</text>
  <rect x="360" y="425" width="270" height="78" class="box"/>
  <rect x="660" y="425" width="270" height="78" class="box"/>
  <rect x="960" y="425" width="270" height="78" class="box"/>
  <text x="495" y="473" text-anchor="middle" class="item">项目资料采集</text>
  <text x="795" y="473" text-anchor="middle" class="item">公开案例采集</text>
  <text x="1095" y="473" text-anchor="middle" class="item">案例审核入库</text>
</svg>
